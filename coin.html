<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #result { font-size: 2rem; font-weight: bold; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Coin Flip</h1>
  <div id="result">Tap to flip</div>
  <button onclick="flipCoin()">Flip Coin</button>

  <script>
    function flipCoin() {
      const outcome = Math.random() < 0.5 ? "Heads" : "Tails";
      document.getElementById("result").textContent = outcome;
    }
  </script>

</body>
</html>
