<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Flip</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .coin {
      width: 140px;
      height: 140px;
      background: gold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #422006;
      border: 6px solid #fef08a;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
      margin: 30px 0;
      /* Slowed down to 2 seconds */
      transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .spin {
      transform: rotateY(1800deg);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <h1>Coin Flip</h1>
  
  <div id="coin" class="coin">HEADS</div>
  
  <button id="btn" onclick="flip()">FLIP COIN</button>

  <script>
    function flip() {
      const coin = document.getElementById('coin');
      const btn = document.getElementById('btn');

      // Lock the button
      btn.disabled = true;
      coin.classList.add('spin');

      // Audio click
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.setValueAtTime(500, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);

      // Wait 2 seconds (2000ms) for the spin to finish
      setTimeout(() => {
        const isHeads = Math.random() < 0.5;
        coin.textContent = isHeads ? "HEADS" : "TAILS";
        
        // Reset rotation position instantly without animating back
        coin.style.transition = 'none';
        coin.classList.remove('spin');
        
        // Force browser display reflow, then restore transition
        void coin.offsetWidth;
        coin.style.transition = 'transform 2s cubic-bezier(0.25, 1, 0.5, 1)';

        // Unlock the button
        btn.disabled = false;
      }, 2000);
    }
  </script>

</body>
</html>
