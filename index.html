<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Flip</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .coin {
      width: 140px;
      height: 140px;
      background: gold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #422006;
      border: 6px solid #fef08a;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
      margin: 20px 0;
      transition: transform 0.6s ease-out;
    }

    .spin {
      transform: rotateY(1800deg) scale(1.1);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:active { transform: scale(0.95); }
    .stats { margin-top: 15px; color: #94a3b8; }
  </style>
</head>
<body>

  <h1>Coin Flip</h1>
  
  <div id="coin" class="coin">HEADS</div>
  
  <button onclick="flip()">FLIP COIN</button>
  
  <div class="stats">
    Heads: <span id="hCount">0</span> | Tails: <span id="tCount">0</span>
  </div>

  <script>
    let heads = 0;
    let tails = 0;

    function flip() {
      const coin = document.getElementById('coin');
      coin.classList.add('spin');

      // Play audio synth tick
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);

      setTimeout(() => {
        const isHeads = Math.random() < 0.5;
        if (isHeads) {
          coin.textContent = "HEADS";
          heads++;
          document.getElementById('hCount').textContent = heads;
        } else {
          coin.textContent = "TAILS";
          tails++;
          document.getElementById('tCount').textContent = tails;
        }
        coin.classList.remove('spin');
      }, 600);
    }
  </script>

</body>
</html>
